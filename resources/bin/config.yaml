# CLIProxyAPI v8 Configuration (Managed by CPA Desktop Daemon)
config-version: 8
models:
  catalog: ""
  codex-catalog: ""
  devin-catalog: ""
server:
  host: ""
  port: 18318
  max-request-body-bytes: 0
  response-compression:
    enabled: true
    min-bytes: 1024
  github-token: ""
  trusted-proxies: []
  tls:
    enable: false
    cert: ""
    key: ""
  commercial-mode: false
  discovery:
    enabled: false
management:
  allow-remote: true
  secret-key: "$2a$10$cXxZXSu4a3aWOx40hUOvlemjUb0vshjEm3oc85rK541pimzipGabu"
  disable-control-panel: false
  disable-auto-update-panel: true
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"
access:
  api-keys:
    - "sk-cpa-local-8888"
routing:
  strategy: "round-robin"
  session-affinity: false
  session-affinity-ttl: "1h"
  session-affinity-subagents: true
  session-affinity-rebind-on: "any"
  force-model-prefix: false
  retry:
    request-retry: 3
    max-retry-credentials: 0
    max-retry-interval: 30
  cooldown:
    disable-cooling: false
    save-cooldown-status: true
    transient-error-cooldown-seconds: 0
requests:
  proxy-url: ""
  tls-handshake-timeout-seconds: 15
  passthrough-headers: false
  nonstream-keepalive-interval: 0
oauth:
  auth-dir: "./auths"
multimedia:
  disable-image-generation: false
  video-result-auth-cache-ttl: "3h"
observability:
  logs:
    debug: false
    logging-to-file: true
    logs-max-total-size-mb: 100
    error-logs-max-files: 10
    request-log: true
  usage:
    usage-statistics-enabled: true
    redis-usage-queue-retention-seconds: 60
  pprof:
    enable: false
    addr: "127.0.0.1:8316"
plugins:
  enabled: true
  dir: "plugins"
  configs:
    gemini-cli:
      enabled: true
    jshandler:
      enabled: true
